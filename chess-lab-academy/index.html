<script>
(()=>{'use strict';
const startFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

const pieceNames={k:'king',q:'queen',r:'rook',b:'bishop',n:'knight',p:'pawn'};
const dirs={n:[-33,-31,-18,-14,14,18,31,33],b:[-17,-15,15,17],r:[-16,-1,1,16],k:[-17,-16,-15,-1,1,15,16,17]};
const on=i=>i>=0&&i<128&&!(i&0x88);
const side=p=>!p||p==='.'?0:p===p.toUpperCase()?1:-1;
const sq=i=>'abcdefgh'[i&7]+(8-(i>>4));
const index=s=>(8-Number(s[1]))*16+'abcdefgh'.indexOf(s[0]);
const key=m=>sq(m[0])+sq(m[1])+m[2];
function parseFen(fen){
 const f=fen.trim().split(/\s+/),rows=f[0].split('/'),b=Array(128).fill('.');
 if(rows.length!==8||!(/^[wb]$/).test(f[1])||!(/^(?:-|K?Q?k?q?)$/).test(f[2])||!(/^(?:-|[a-h][36])$/).test(f[3]))throw Error('Invalid starting FEN');
 rows.forEach((row,r)=>{let c=0;for(const p of row){if(/^[1-8]$/.test(p))c+=Number(p);else{if(!/^[prnbqkPRNBQK]$/.test(p)||c>=8)throw Error('Invalid FEN rank');b[r*16+c++]=p;}}if(c!==8)throw Error('Invalid FEN rank');});
 if(b.filter(p=>p==='K').length!==1||b.filter(p=>p==='k').length!==1)throw Error('Position requires two kings');
 const c=(f[2].includes('K')?1:0)|(f[2].includes('Q')?2:0)|(f[2].includes('k')?4:0)|(f[2].includes('q')?8:0);
 return {b,t:f[1]==='w'?1:-1,c,ep:f[3]==='-'?-1:index(f[3]),half:Number(f[4]||0),full:Number(f[5]||1)};
}
const start=parseFen(startFen);
function attacked(s,target,by){
 for(let f=0;f<128;f++){
  if(!on(f)||side(s.b[f])!==by)continue;
  const p=s.b[f].toLowerCase();
  if(p==='p'){if(target===f-16*by-1||target===f-16*by+1)return true;continue;}
  for(const d of (dirs[p]||dirs.k))for(let t=f+d;on(t);t+=d){if(t===target)return true;if(s.b[t]!=='.'||p==='n'||p==='k')break;}
 }
 return false;
}
const checked=(s,color=s.t)=>attacked(s,s.b.indexOf(color===1?'K':'k'),-color);
function apply(s,m){
 const [f,t,promo,flag]=m,b=s.b.slice(),piece=b[f],captured=b[t];let c=s.c;
 b[f]='.';b[t]=promo?(s.t===1?promo.toUpperCase():promo):piece;
 if(flag==='ep')b[t+16*s.t]='.';
 if(flag==='castle'){const rf=t>f?f+3:f-4,rt=t>f?f+1:f-1;b[rt]=b[rf];b[rf]='.';}
 if(piece==='K')c&=~3;if(piece==='k')c&=~12;
 const rookBit={119:1,112:2,7:4,0:8};
 if(piece.toLowerCase()==='r')c&=~(rookBit[f]||0);
 if(captured.toLowerCase()==='r')c&=~(rookBit[t]||0);
 return {b,t:-s.t,c,ep:piece.toLowerCase()==='p'&&Math.abs(t-f)===32?(t+f)/2:-1,half:piece.toLowerCase()==='p'||captured!=='.'||flag==='ep'?0:s.half+1,full:s.full+(s.t===-1?1:0)};
}
function pseudo(s){
 const out=[];
 for(let f=0;f<128;f++){
  if(!on(f)||side(s.b[f])!==s.t)continue;
  const p=s.b[f].toLowerCase();
  const add=(t,flag='')=>{if(s.b[t].toLowerCase()==='k')return;if(p==='p'&&(t>>4===0||t>>4===7))for(const q of ['q','r','b','n'])out.push([f,t,q,flag]);else out.push([f,t,'',flag]);};
  if(p==='p'){
   const t=f-16*s.t;
   if(on(t)&&s.b[t]==='.'){add(t);const u=t-16*s.t;if(f>>4===(s.t===1?6:1)&&s.b[u]==='.')add(u);}
   for(const d of [-1,1]){const u=t+d;if(!on(u))continue;if(side(s.b[u])===-s.t)add(u);else if(u===s.ep&&s.b[u]==='.'&&s.b[u+16*s.t]===(s.t===1?'p':'P'))add(u,'ep');}
  }else{
   for(const d of (dirs[p]||dirs.k))for(let t=f+d;on(t);t+=d){if(side(s.b[t])===s.t)break;add(t);if(s.b[t]!=='.'||p==='n'||p==='k')break;}
   const home=s.t===1?116:4,rook=s.t===1?'R':'r',bits=s.t===1?[1,2]:[4,8];
   if(p==='k'&&f===home&&!checked(s)){
    if((s.c&bits[0])&&s.b[f+3]===rook&&s.b[f+1]==='.'&&s.b[f+2]==='.'&&!attacked(s,f+1,-s.t)&&!attacked(s,f+2,-s.t))add(f+2,'castle');
    if((s.c&bits[1])&&s.b[f-4]===rook&&s.b[f-1]==='.'&&s.b[f-2]==='.'&&s.b[f-3]==='.'&&!attacked(s,f-1,-s.t)&&!attacked(s,f-2,-s.t))add(f-2,'castle');
   }
  }
 }

}
const legal=s=>pseudo(s).filter(m=>!checked(apply(s,m),s.t));
function san(s,m){
 const [f,t,promo,flag]=m,p=s.b[f].toUpperCase(),capture=s.b[t]!=='.'||flag==='ep';let txt='';
 if(flag==='castle')txt=t>f?'O-O':'O-O-O';
 else{
  if(p!=='P'){
   txt=p;const others=legal(s).filter(x=>x[0]!==f&&x[1]===t&&s.b[x[0]]===s.b[f]);
   if(others.length)txt+=!others.some(x=>(x[0]&7)===(f&7))?sq(f)[0]:!others.some(x=>(x[0]>>4)===(f>>4))?sq(f)[1]:sq(f);
  }else if(capture)txt=sq(f)[0];
  txt+=(capture?'x':'')+sq(t)+(promo?'='+promo.toUpperCase():'');

const moveLabel=(s,m)=>s.full+(s.t===1?'. ':'... ')+san(s,m);
const positionKey=s=>s.b.join('')+':'+s.t+':'+s.c+':'+(s.ep>=0&&legal(s).some(m=>m[3]==='ep')?s.ep:-1);
function insufficient(s){
 const pieces=[];for(let i=0;i<128;i++)if(on(i)&&s.b[i]!=='.'&&s.b[i].toLowerCase()!=='k')pieces.push([s.b[i].toLowerCase(),((i>>4)+(i&7))%2]);

}
function gameStatus(history){
 const s=history[history.length-1],moves=legal(s),check=checked(s),k=positionKey(s),repeats=history.filter(p=>positionKey(p)===k).length;
 if(!moves.length)return {done:true,text:check?'Checkmate — '+(s.t===1?'Black':'White')+' wins!':'Draw — stalemate.',claim:''};
 if(insufficient(s))return {done:true,text:'Draw — insufficient material.',claim:''};
 if(s.half>=150||repeats>=5)return {done:true,text:'Draw — '+(s.half>=150?'75-move rule.':'fivefold repetition.'),claim:''};
 return {done:false,text:(s.t===1?'White':'Black')+' to move'+(check?' · Check!':''),claim:repeats>=3?'threefold repetition':s.half>=100?'50-move rule':''};
}
function toFen(s){
 const rows=[];for(let r=0;r<8;r++){let out='',empty=0;for(let f=0;f<8;f++){const p=s.b[r*16+f];if(p==='.'){empty++;continue;}if(empty){out+=empty;empty=0;}out+=p;}if(empty)out+=empty;rows.push(out);}
 const cast=(s.c&1?'K':'')+(s.c&2?'Q':'')+(s.c&4?'k':'')+(s.c&8?'q':'');
 return rows.join('/')+' '+(s.t===1?'w':'b')+' '+(cast||'-')+' '+(s.ep<0?'-':sq(s.ep))+' '+s.half+' '+s.full;
}

function $id(id){return document.getElementById(id);}
function add(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;}
function button(label,handler,primary=false){const b=add('button',label,'btn'+(primary?' primary':''));b.type='button';b.onclick=handler;return b;}
function insert(par,...els){for(const e of els)par.appendChild(e);return par;}
function fromLine(line){let s=start;for(const uci of line){const m=legal(s).find(x=>key(x)===uci);if(!m)throw Error('Invalid exercise move: '+uci);s=apply(s,m);}return s;}
const operaUci='e2e4 e7e5 g1f3 d7d6 d2d4 c8g4 d4e5 g4f3 d1f3 d6e5 f1c4 g8f6 f3b3 d8e7 b1c3 c7c6 c1g5 b7b5 c3b5 c6b5 c4b5 b8d7 e1c1 a8d8 d1d7 d8d7 h1d1 e7e6 b5d7 f6d7 b3b8 d7b8 d1d8'.split(' ');
const opera=[start],operaNames=[],operaSAN=[];for(const u of operaUci){const p=opera.at(-1),m=legal(p).find(x=>key(x)===u);if(!m)throw Error('Invalid Opera Game move '+u);operaNames.push(moveLabel(p,m));operaSAN.push(san(p,m));opera.push(apply(p,m));}
if(!gameStatus(opera).done)throw Error('Opera Game does not terminate');
const keyMoments={
  4:['Take space with your pawn. Why is d4 powerful?','White establishes a second central pawn. Morphy is willing to open the position while ahead in development.'],
  10:['Bring the bishop into the attack.','Bc4 develops a piece and pressures f7, usually the most vulnerable pawn near the black king.'],
  12:['Find a move that attacks two targets.','Qb3 simultaneously targets b7 and f7. Compare the move with simply moving the queen at random.'],
  18:['Can you find the surprising knight move?','Nxb5 gives up a knight to open the b-file and diagonals around Black’s uncastled king.'],
  24:['What should White do with the rook?','Rxd7 removes a defender; Morphy keeps initiative with his other rook.'],
  30:['Find the forcing queen sacrifice.','Qb8+ forces ...Nxb8, so White’s rook can reach d8 with checkmate.'],
  32:['Finish the game with checkmate.','Rd8# is protected by the bishop on g5. All of White’s active pieces coordinated.']
};
const lessonDefs=[
 {name:'Control the centre',tag:'1 / 4 · Opening basics',line:[],accept:['e2e4','d2d4'],prompt:'Your turn: claim the centre with a pawn.',short:'Central pawns give your pieces more space.',details:'Both e4 and d4 are strong opening moves. Avoid memorising one mandatory first move: your goal is to control central squares and open lines for your pieces.'},
 {name:'Develop with a purpose',tag:'2 / 4 · Active pieces',line:['e2e4','e7e5'],accept:['g1f3'],prompt:'Which knight move develops with an attack?',short:'Nf3 develops and attacks the e5 pawn.',details:'One useful move can do two jobs. Nf3 activates a knight and threatens Black’s pawn. You are learning to develop pieces with a purpose rather than moving them randomly.'},
 {name:'King safety',tag:'3 / 4 · Castling',line:['e2e4','e7e5','g1f3','b8c6','f1c4','f8c5'],accept:['e1g1'],prompt:'Find the legal move that protects your king.',short:'Castling makes your king safer and activates a rook.',details:'Castling moves two pieces at once: the king shifts two squares and the rook jumps beside it. You cannot castle through, into, or out of check.'},
 {name:'Find the checkmate',tag:'4 / 4 · Tactical vision',line:operaUci.slice(0,32),accept:['d1d8'],prompt:'White to move: deliver checkmate in one.',short:'Rd8# works because the bishop protects the rook.',details:'The rook arrives on d8 with check, and the bishop on g5 guards that rook. The black king cannot escape. This is the actual final move of Morphy’s Opera Game.'}
];
lessonDefs.forEach(l=>{const s=fromLine(l.line);l.position=s;for(const u of l.accept)if(!legal(s).some(m=>key(m)===u))throw Error('Invalid lesson move '+u);});
let saved={};try{saved=JSON.parse(localStorage.getItem('chessLabAcademyV1')||'{}')||{};}catch{}
const app={mode:['learn','study','practice'].includes(saved.mode)?saved.mode:'learn',lesson:Math.max(0,Math.min(3,Number(saved.lesson)||0)),completed:Array.isArray(saved.completed)?saved.completed.filter(x=>Number.isInteger(x)&&x>=0&&x<4):[],step:Math.max(0,Math.min(operaUci.length,Number(saved.step)||0)),strength:Number.isInteger(saved.strength)?saved.strength:5,selected:-1,answer:null,answeredAt:-1,preview:null,practice:[start],pracMoves:[],botBusy:false,engineReady:false,engineError:'',engineAnalysis:[],analysisFen:'',analysisLoading:false,turnMessage:'',expanded:false,nonce:0};
try{if(Array.isArray(saved.practiceMoves)){for(const u of saved.practiceMoves.slice(0,400)){const s=app.practice.at(-1),m=legal(s).find(x=>key(x)===u);if(!m)break;app.pracMoves.push(u);app.practice.push(apply(s,m));}}}catch{}
function save(){try{localStorage.setItem('chessLabAcademyV1',JSON.stringify({mode:app.mode,lesson:app.lesson,completed:app.completed,step:app.step,strength:app.strength,practiceMoves:app.pracMoves}));}catch{}}
function current(){return app.mode==='learn'?lessonDefs[app.lesson].position:app.mode==='study'?opera[app.step]:app.practice.at(-1);}
function note(text,kind='',details=''){const n=$id('statusNote');n.className='note'+(kind?' '+kind:'');n.replaceChildren();n.appendChild(add('strong',text));if(details)n.appendChild(add('small',details));n.setAttribute('role',details?'button':'status');n.onclick=details?()=>{app.expanded=!app.expanded;renderNote();}:null;}
function renderNote(){
 if(app.mode==='learn'){const l=lessonDefs[app.lesson];if(app.answer){note(app.answer.good?'✓ '+l.short:'Not quite. Try a different move.',app.answer.good?'':'warning',app.expanded?l.details:'Tap here for the full explanation.');}
 else note(l.prompt,'','Tap a piece, then a legal destination.');}
 if(app.mode==='study'){
  if(app.preview){note(app.preview.good?'✓ That is the move Morphy played.':'Morphy played '+operaSAN[app.step]+'.','',app.preview.good?keyMoments[app.step]?.[1]:'A different move can still be playable. Compare it with Morphy’s idea.');}
  else if(app.step>=operaUci.length){note('Checkmate — White won.','', 'Morphy finished in 17 moves.');}
  else if(keyMoments[app.step]&&app.answeredAt!==app.step){note('Your turn: '+keyMoments[app.step][0],'','Choose a move on the board before revealing Morphy’s move.');}
  else {const last=app.step?operaNames[app.step-1]:null;note(last?'Last move: '+last:'Paul Morphy vs Brunswick & Isouard','',last?(keyMoments[app.step-1]?.[1]||'Tap Next to follow the real game.'):'Paris, 1858 · Study a real historic game.');}
 }
 if(app.mode==='practice'){
   const st=gameStatus(app.practice);
   if(st.done)note(st.text);
   else if(app.botBusy)note('Stockfish is thinking…');
   else if(!app.engineReady)note('Engine loading — practice will begin when ready.','warning',app.engineError||'No weak fallback bot: we will not invent a recommended move.');
   else if(app.turnMessage)note(app.turnMessage,'', 'Use Analyse position to explore other moves.');
   else note('You are White. Make a move and see Stockfish respond.','','Choose a piece then a green destination.');
 }
}
const workerEngine={worker:null,ready:false,busy:null,queue:[],error:'',loading:false};
function engineStatus(text){$id('engineStatus').textContent=text;}
function abortJobs(message){if(workerEngine.busy){workerEngine.busy.reject(Error(message));workerEngine.busy=null;}for(const j of workerEngine.queue)j.reject(Error(message));workerEngine.queue=[];}
function bootEngine(){
 if(workerEngine.loading)return;workerEngine.loading=true;engineStatus('Loading Stockfish…');
 try{
  const w=new Worker('./engine/stockfish-19-lite-single.js');workerEngine.worker=w;
  w.onmessage=event=>{
   for(const raw of String(event.data||'').split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    if(line==='uciok'){w.postMessage('isready');continue;}
    if(line==='readyok'){workerEngine.ready=true;app.engineReady=true;app.engineError='';engineStatus('● Stockfish ready');pump();render();continue;}
    const job=workerEngine.busy;if(!job)continue;
    if(line.startsWith('info ')&&line.includes(' pv ')){
      const depth=/\bdepth (\d+)/.exec(line),mp=/\bmultipv (\d+)/.exec(line),cp=/\bscore cp (-?\d+)/.exec(line),mate=/\bscore mate (-?\d+)/.exec(line),pv=/\bpv ([a-h][1-8][a-h][1-8][qrbn]?)/.exec(line);
      if(pv){const id=mp?Number(mp[1]):1;const score=cp?Number(cp[1]):mate?Math.sign(Number(mate[1]))*100000:null;const old=job.lines.get(id);
       if(!old||Number(depth?.[1]||0)>=old.depth)job.lines.set(id,{uci:pv[1],score,depth:Number(depth?.[1]||0),mate:mate?Number(mate[1]):null});
      }
    }
    if(line.startsWith('bestmove ')){
     const m=/^bestmove ([a-h][1-8][a-h][1-8][qrbn]?|\(none\))/.exec(line);
     workerEngine.busy=null;clearTimeout(job.timeout);
     job.resolve({uci:m&&m[1]!=='(none)'?m[1]:null,lines:[...job.lines.values()].sort((a,b)=>b.score-a.score)});
     pump();
    }
   }
  };
  w.onerror=()=>{
   workerEngine.loading=false;workerEngine.ready=false;app.engineReady=false;app.engineError='Engine failed to start; reload the page to retry.';engineStatus('Engine unavailable');abortJobs(app.engineError);render();
  };
  w.postMessage('uci');
 }catch(e){app.engineError='Your browser could not load the chess engine.';engineStatus('Engine unavailable');render();}
}
function pump(){
 if(!workerEngine.ready||workerEngine.busy||!workerEngine.queue.length)return;
 const job=workerEngine.queue.shift();workerEngine.busy=job;
 workerEngine.worker.postMessage('setoption name MultiPV value '+job.multi);
 workerEngine.worker.postMessage('setoption name Skill Level value '+job.skill);
 workerEngine.worker.postMessage('position fen '+job.fen);
 workerEngine.worker.postMessage('go movetime '+job.ms);
 job.timeout=setTimeout(()=>{if(workerEngine.busy!==job)return;workerEngine.worker.postMessage('stop');},Math.max(8000,job.ms*6));
}
function engineSearch(s,opts={}){
 if(!workerEngine.ready)return Promise.reject(Error('Chess engine not ready'));
 return new Promise((resolve,reject)=>{workerEngine.queue.push({fen:toFen(s),multi:opts.multi||1,ms:opts.ms||850,skill:opts.skill??20,lines:new Map(),resolve,reject,timeout:0});pump();});
}
function changeMode(mode){app.mode=mode;app.selected=-1;app.answer=null;app.preview=null;app.expanded=false;app.turnMessage='';app.nonce++;save();render();}
function playLocalMove(m){
 const s=current();if(!legal(s).some(x=>key(x)===key(m)))return;
 if(app.mode==='learn'){
  const l=lessonDefs[app.lesson],good=l.accept.includes(key(m));
  app.answer={good,uci:key(m)};app.expanded=false;
  if(good&&!app.completed.includes(app.lesson)){app.completed.push(app.lesson);save();}
 }else if(app.mode==='study'){
  const good=key(m)===operaUci[app.step];
  app.preview={uci:key(m),good};app.answeredAt=app.step;app.expanded=false;
 }else if(app.mode==='practice'){
  if(!app.engineReady||app.botBusy||s.t!==1)return;
  const userUci=key(m),version=++app.nonce;app.botBusy=true;app.turnMessage='';
  app.practice.push(apply(s,m));app.pracMoves.push(userUci);save();render();
  const after=current();if(gameStatus(app.practice).done){app.botBusy=false;render();return;}
  engineSearch(after,{ms:650,skill:app.strength,multi:1}).then(out=>{
   if(version!==app.nonce||app.mode!=='practice')return;
   const reply=legal(current()).find(x=>key(x)===out.uci);
   if(reply){const label=moveLabel(current(),reply);app.pracMoves.push(key(reply));app.practice.push(apply(current(),reply));app.turnMessage='Stockfish played '+label+'. What changed?';save();}
   else app.turnMessage='No legal reply was returned.';
  }).catch(e=>{if(version===app.nonce)app.turnMessage='Engine error: '+e.message;})
  .finally(()=>{if(version===app.nonce){app.botBusy=false;render();}});
 }
 app.selected=-1;render();
}
function clickedSquare(i){
 if(app.mode==='practice'&&!app.engineReady)return;
 const s=current(),allowed=app.mode==='practice'?!app.botBusy&&s.t===1:app.mode==='learn'?!app.answer?.good:app.step<operaUci.length&&keyMoments[app.step]&&app.answeredAt!==app.step;
 if(!allowed||app.mode==='study'&&app.preview)return;
 if(side(s.b[i])===s.t){app.selected=app.selected===i?-1:i;renderBoard();return;}
 const candidates=legal(s).filter(m=>m[0]===app.selected&&m[1]===i);
 if(candidates.length){
  const m=candidates.find(x=>x[2]==='q')||candidates[0];playLocalMove(m);
 }else if(app.selected>=0){app.selected=-1;renderBoard();}
}
function renderArrows(board,arr){
 if(!arr?.length)return;
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('class','arrows');svg.setAttribute('viewBox','0 0 800 800');svg.setAttribute('aria-hidden','true');
 const defs=document.createElementNS(ns,'defs');for(const [name,color]of [['g','#15954a'],['y','#e0ad22']]){
  const mark=document.createElementNS(ns,'marker');mark.setAttribute('id','arrow-'+name);mark.setAttribute('markerWidth','4');mark.setAttribute('markerHeight','4');mark.setAttribute('refX','3.4');mark.setAttribute('refY','2');mark.setAttribute('orient','auto');mark.setAttribute('viewBox','0 0 4 4');
  const triangle=document.createElementNS(ns,'path');triangle.setAttribute('d','M0 0 L4 2 L0 4 Z');triangle.setAttribute('fill',color);mark.appendChild(triangle);defs.appendChild(mark);}
 svg.appendChild(defs);
 arr.forEach((item,n)=>{const f=index(item.uci.slice(0,2)),t=index(item.uci.slice(2,4)),x1=(f&7)*100+50,y1=(f>>4)*100+50,x2=(t&7)*100+50,y2=(t>>4)*100+50;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,c=item.best?'#15954a':'#e0ad22',path=document.createElementNS(ns,'path');
  path.setAttribute('d','M '+(x1+dx/len*20)+' '+(y1+dy/len*20)+' L '+(x2-dx/len*23)+' '+(y2-dy/len*23));path.setAttribute('stroke',c);path.setAttribute('stroke-width',item.best?'12':'8');
  path.setAttribute('stroke-linecap','round');path.setAttribute('fill','none');path.setAttribute('opacity',item.best?'.92':'.72');path.setAttribute('marker-end','url(#arrow-'+(item.best?'g':'y')+')');svg.appendChild(path);
 });
 $id('boardWrap').appendChild(svg);
}
function renderBoard(){
 const b=$id('board'),wrap=$id('boardWrap');wrap.querySelector('.arrows')?.remove();b.replaceChildren();
 let s=current(),recent=null;
 if(app.mode==='study'){if(app.preview){const m=legal(s).find(x=>key(x)===app.preview.uci);if(m){recent=m;s=apply(s,m);}}else if(app.step>0)recent=legal(opera[app.step-1]).find(x=>key(x)===operaUci[app.step-1]);}
 if(app.mode==='practice'&&app.pracMoves.length>0){const p=app.practice[app.practice.length-2];recent=legal(p).find(x=>key(x)===app.pracMoves.at(-1));}
 const active=app.mode==='learn'?!app.answer?.good:app.mode==='study'?!!keyMoments[app.step]&&!app.preview&&app.answeredAt!==app.step:app.engineReady&&!app.botBusy&&s.t===1;
 const targets=active?legal(s).filter(m=>m[0]===app.selected).map(m=>m[1]):[];
 for(let n=0;n<64;n++){
  const i=(n>>3)*16+(n&7),p=s.b[i],cell=add('button',undefined,'sq '+(((i>>4)+(i&7))%2?'dark':'light'));
  cell.type='button';if(recent&&[recent[0],recent[1]].includes(i))cell.classList.add('recent');
  if(app.selected===i)cell.classList.add('chosen');if(targets.includes(i))cell.classList.add('take');
  cell.setAttribute('aria-label',sq(i)+': '+(p==='.'?'empty':(side(p)===1?'White ':'Black ')+pieceNames[p.toLowerCase()]));
  cell.onclick=()=>clickedSquare(i);
  if(p!=='.'){const icon=add('span',glyph[p],'piece '+(side(p)===1?'white':'black'));icon.setAttribute('aria-hidden','true');cell.appendChild(icon);}
  if(targets.includes(i))cell.appendChild(add('span','','dot'));
  if((i&7)===0)cell.appendChild(add('span',String(8-(i>>4)),'coord rank'));
  if((i>>4)===7)cell.appendChild(add('span',sq(i)[0],'coord file'));b.appendChild(cell);
 }
 const arrows=[];
 if(app.mode==='practice'&&app.analysisFen===toFen(s)&&app.engineAnalysis.length)
  app.engineAnalysis.slice(0,3).forEach((x,i)=>{if(legal(s).some(m=>key(m)===x.uci))arrows.push({uci:x.uci,best:i===0});});
 if(app.mode==='learn'&&app.answer?.good)arrows.push({uci:app.answer.uci,best:true});
 renderArrows(b,arrows);
 $id('turnLabel').textContent=gameStatus(app.mode==='practice'?app.practice:app.mode==='study'?opera.slice(0,app.step+1):[s]).done?'Game over':s.t===1?'White to move':'Black to move';
 $id('moveLabel').textContent='Move '+s.full;
 $id('topPlayer').textContent=app.mode==='study'?'♚ Brunswick & Isouard':'♚ Black';
}
function renderButtons(){
 const root=$id('boardButtons');root.replaceChildren();
 if(app.mode==='learn'){
  root.appendChild(button(app.lesson===3?'Restart lessons':'Next lesson →',()=>{app.lesson=app.lesson===3?0:app.lesson+1;app.answer=null;app.selected=-1;app.expanded=false;save();render();},true));
  root.appendChild(button('Retry',()=>{app.answer=null;app.selected=-1;app.expanded=false;render();}));
 }else if(app.mode==='study'){
  root.appendChild(button('← Back',()=>{if(app.step){app.step--;app.preview=null;app.answeredAt=-1;app.selected=-1;save();render();}},false));
  root.appendChild(button(app.step>=33?'Replay game':app.preview?'Show game move →':keyMoments[app.step]&&app.answeredAt!==app.step?'Reveal move →':'Next move →',()=>{
   if(app.step>=33){app.step=0;app.preview=null;app.answeredAt=-1;}else{app.step++;app.preview=null;app.answeredAt=-1;}
   app.selected=-1;save();render();
  },true));
 }else{
  root.appendChild(button('Undo turn',()=>{app.nonce++;app.botBusy=false;const count=app.practice.length>2?2:app.practice.length-1;if(count>0){app.practice.splice(-count);app.pracMoves.splice(-count);}app.turnMessage='Last turn undone.';app.engineAnalysis=[];app.analysisFen='';save();render();},false));
  root.appendChild(button('New game',()=>{app.nonce++;app.botBusy=false;app.practice=[start];app.pracMoves=[];app.turnMessage='';app.engineAnalysis=[];app.analysisFen='';save();render();}));
 }
}
function renderDetails(){
 const panel=$id('details');panel.replaceChildren();
 if(app.mode==='learn'){
  const l=lessonDefs[app.lesson];
  panel.appendChild(add('div',l.tag,'kicker'));panel.appendChild(add('h2',l.name));
  panel.appendChild(add('p','Solve the position by moving a piece. The answer stays hidden until you try.','desc'));
  const progress=add('div',undefined,'progress');const progressFill=add('div');progressFill.style.width=Math.round(app.completed.length/4*100)+'%';progress.appendChild(progressFill);panel.appendChild(progress);
  panel.appendChild(add('p',app.completed.length+' of 4 lessons completed','small'));
  const options=add('div',undefined,'options');
  lessonDefs.forEach((item,i)=>{const b=add('button',(app.completed.includes(i)?'✓ ':'')+(i+1)+'. '+item.name,'option'+(app.lesson===i?' selected':''));
   b.onclick=()=>{app.lesson=i;app.answer=null;app.selected=-1;app.expanded=false;save();render();};options.appendChild(b);});panel.appendChild(options);
  if(app.answer){const d=add('details');d.open=app.expanded;const t=add('summary','Why this works');const p=add('p',l.details);d.append(t,p);d.addEventListener('toggle',()=>{app.expanded=d.open;});panel.appendChild(d);}
 }else if(app.mode==='study'){
  panel.appendChild(add('div','REAL GAME · PARIS 1858','kicker'));panel.appendChild(add('h2','Morphy’s Opera Game'));
  panel.appendChild(add('p','Paul Morphy (White) vs Duke of Brunswick & Count Isouard (Black). A 17-move lesson in developing with threats.','desc'));
  panel.appendChild(add('p','Played '+app.step+' of 33 half-moves','small'));
  const bar=add('div',undefined,'progress'),inner=add('div');inner.style.width=(app.step/operaUci.length*100)+'%';bar.appendChild(inner);panel.appendChild(bar);
  const moveList=add('div',undefined,'history');
  operaNames.slice(0,app.step).forEach((x,i)=>moveList.appendChild(add('span',x,'move'+(i===app.step-1?' current':''))));
  if(!app.step)moveList.appendChild(add('span','The game starts with 1. e4','empty'));panel.appendChild(moveList);
  if(app.step<33&&keyMoments[app.step]&&app.answeredAt!==app.step)panel.appendChild(add('p','Your turn! Predict Morphy’s move on the board before revealing it.','desc'));
  if(app.preview)panel.appendChild(add('p',keyMoments[app.step]?.[1]||'Study what changed after this move.','desc'));
  const link=add('a','View original game source ↗','small');link.href='https://en.wikipedia.org/wiki/Opera_Game';link.target='_blank';link.rel='noopener';panel.appendChild(link);
 }else{
  panel.appendChild(add('div','ENGINE PRACTICE','kicker'));panel.appendChild(add('h2','Play against Stockfish'));
  panel.appendChild(add('p','Move as White. The computer uses a real chess engine, not our old homemade bot.','desc'));
  const skill=insert(add('div',undefined,'section'),add('label','Computer strength: ','label'));const select=add('select',undefined,'select');
  for(const [val,title] of [[0,'Beginner'],[5,'Casual'],[11,'Developing'],[18,'Strong']]){const opt=add('option',title);opt.value=String(val);if(app.strength===val)opt.selected=true;select.appendChild(opt);}
  select.onchange=()=>{app.strength=Number(select.value);save();};skill.appendChild(select);panel.appendChild(skill);
  panel.appendChild(add('p','Strength settings are approximate, not guaranteed player ratings.','small'));
  const actions=add('div',undefined,'controls');
  const analyze=button('Analyse position',async()=>{
   if(!app.engineReady||app.botBusy||app.analysisLoading)return;
   app.analysisLoading=true;app.engineAnalysis=[];app.analysisFen='';app.turnMessage='Stockfish is checking options…';render();
   const s=current(),nonce=app.nonce;
   try{const result=await engineSearch(s,{ms:1200,multi:3,skill:20});
    if(nonce!==app.nonce)return;app.engineAnalysis=result.lines;app.analysisFen=toFen(s);
    app.turnMessage=result.lines.length?'Green is Stockfish’s first choice. Tap a label below to compare.':'Stockfish did not return alternatives.';}
   catch(e){app.turnMessage='Analysis failed: '+e.message;}
   finally{app.analysisLoading=false;render();}
  },true);
  analyze.disabled=!app.engineReady||app.botBusy||app.analysisLoading||gameStatus(app.practice).done;
  actions.appendChild(analyze);panel.appendChild(actions);
  if(app.engineAnalysis.length&&app.analysisFen===toFen(current())){
   const s=current(),options=add('div',undefined,'options');
   app.engineAnalysis.slice(0,3).forEach((item,i)=>{
    const m=legal(s).find(x=>key(x)===item.uci);if(!m)return;
    const caption=item.mate?'Mate in '+Math.abs(item.mate):item.score!==null?(item.score/100).toFixed(2)+' pawns (side to move)':'';
    const b=add('button',(i===0?'● Recommended: ':'○ Alternative: ')+moveLabel(s,m),'option');
    b.appendChild(add('span',caption));b.onclick=()=>{app.turnMessage='Stockfish suggests '+moveLabel(s,m)+'. It changes the position by '+(s.b[m[1]]==='.'?'activating a piece.':'capturing a piece.');renderNote();};options.appendChild(b);
   });panel.appendChild(options);
  }
  const history=add('div',undefined,'section');history.appendChild(add('div','Your game','label'));
  const list=add('div',undefined,'history');let s=start;
  for(const u of app.pracMoves){const m=legal(s).find(x=>key(x)===u);if(!m)break;list.appendChild(add('span',moveLabel(s,m),'move'));s=apply(s,m);}if(!app.pracMoves.length)list.appendChild(add('span','No moves yet','empty'));history.appendChild(list);panel.appendChild(history);
 }
}
function render(){
 document.querySelectorAll('[data-mode]').forEach(el=>{const on=el.dataset.mode===app.mode;el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on));});
 renderBoard();renderNote();renderButtons();renderDetails();
}
document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>changeMode(el.dataset.mode));
render();bootEngine();

})();
</script></body></html>
